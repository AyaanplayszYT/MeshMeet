<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>MeshMeet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              gray: {
                750: '#2d3748',
                850: '#1a202c',
                950: '#09090b', // Zinc-950 equivalent
              },
              zinc: {
                800: '#27272a',
                900: '#18181b',
                950: '#09090b',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom sleek dark scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
      }

      /* Floating Emojis Animation */
      @keyframes floatUp {
        0% {
          opacity: 0;
          transform: translate(-50%, 20px) scale(0.6);
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -15px) scale(1.25);
        }
        75% {
          opacity: 1;
          transform: translate(calc(-50% + var(--drift, 0px)), -130px) scale(1.05);
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--drift, 0px)), -190px) scale(0.75);
        }
      }
      .animate-float-up {
        animation: floatUp 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body class="bg-black text-zinc-100 font-sans antialiased selection:bg-zinc-700 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
